<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academy Awards Explorer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --surface2: #222240;
    --gold: #d4af37;
    --gold-dim: #b8962e;
    --text: #e8e8f0;
    --text-dim: #9090a8;
    --blue: #4a90d9;
    --green: #3ddc84;
    --pink: #e91e8c;
    --red: #ff4757;
    --radius: 10px;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    line-height: 1.5;
  }
  a { color: var(--gold); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Header */
  .header {
    text-align: center;
    padding: 2.5rem 1rem 1.5rem;
    background: linear-gradient(180deg, #1a1a2e 0%, var(--bg) 100%);
    border-bottom: 1px solid rgba(212,175,55,0.15);
  }
  .header h1 {
    font-size: 2.4rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    background: linear-gradient(135deg, var(--gold) 0%, #f5e6a3 50%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header p { color: var(--text-dim); font-size: 1rem; margin-top: 0.25rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 300; }

  /* Filters */
  .filters {
    max-width: 1400px;
    margin: 0 auto;
    padding: 1.25rem 1.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    align-items: flex-end;
    background: var(--surface);
    border-radius: var(--radius);
    margin-top: 1rem;
    margin-left: 1rem;
    margin-right: 1rem;
    border: 1px solid rgba(212,175,55,0.1);
  }
  .filter-group { display: flex; flex-direction: column; gap: 0.3rem; }
  .filter-group label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); font-weight: 600; }
  .filter-group input[type="text"],
  .filter-group select {
    background: var(--surface2);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text);
    padding: 0.5rem 0.75rem;
    border-radius: 6px;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .filter-group input[type="text"]:focus,
  .filter-group select:focus { border-color: var(--gold); }
  .filter-group input[type="text"] { width: 200px; }
  .filter-group select { min-width: 140px; }
  .checkboxes { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
  .checkboxes label {
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    gap: 0.3rem;
    cursor: pointer;
    color: var(--text);
    text-transform: none;
    letter-spacing: 0;
    font-weight: 400;
  }
  .checkboxes input[type="checkbox"] { accent-color: var(--gold); width: 15px; height: 15px; }
  .toggle-group { display: flex; align-items: center; gap: 0.5rem; }
  .toggle-group label.toggle-label { font-size: 0.8rem; color: var(--text); text-transform: none; letter-spacing: 0; font-weight: 400; cursor: pointer; }
  .switch {
    position: relative;
    width: 40px;
    height: 22px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--surface2);
    border-radius: 22px;
    transition: 0.3s;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .slider::before {
    content: '';
    position: absolute;
    height: 16px;
    width: 16px;
    left: 2px;
    bottom: 2px;
    background: var(--text-dim);
    border-radius: 50%;
    transition: 0.3s;
  }
  .switch input:checked + .slider { background: var(--gold-dim); }
  .switch input:checked + .slider::before { transform: translateX(18px); background: #fff; }

  /* Year range */
  .year-range-container { display: flex; flex-direction: column; gap: 0.3rem; min-width: 240px; }
  .year-range-container label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); font-weight: 600; }
  .year-range-inputs { display: flex; align-items: center; gap: 0.5rem; }
  .year-range-inputs input[type="number"] {
    width: 70px;
    background: var(--surface2);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text);
    padding: 0.5rem;
    border-radius: 6px;
    font-size: 0.85rem;
    text-align: center;
    outline: none;
  }
  .year-range-inputs input[type="number"]:focus { border-color: var(--gold); }
  .year-range-inputs span { color: var(--text-dim); font-size: 0.85rem; }

  /* Stats bar */
  .stats-bar {
    max-width: 1400px;
    margin: 0.75rem auto 0;
    padding: 0.6rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .stats { display: flex; gap: 1.5rem; }
  .stat { font-size: 0.85rem; color: var(--text-dim); }
  .stat strong { color: var(--gold); font-weight: 700; }
  .view-toggle { display: flex; gap: 0.5rem; }
  .view-btn {
    background: var(--surface2);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text-dim);
    padding: 0.4rem 0.8rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.2s;
  }
  .view-btn.active, .view-btn:hover { background: var(--gold-dim); color: #000; border-color: var(--gold); }

  /* Cards grid */
  .card-grid {
    max-width: 1400px;
    margin: 1rem auto 2rem;
    padding: 0 1rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1rem;
  }
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 1.2rem;
    border: 1px solid rgba(255,255,255,0.05);
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    position: relative;
    overflow: hidden;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    border-color: rgba(212,175,55,0.25);
  }
  .card.winner::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold), #f5e6a3, var(--gold));
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
  .card-year { font-size: 0.8rem; color: var(--text-dim); font-weight: 600; }
  .card-badges { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .badge {
    font-size: 0.65rem;
    padding: 0.15rem 0.5rem;
    border-radius: 20px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .badge-picture { background: rgba(212,175,55,0.2); color: var(--gold); }
  .badge-director { background: rgba(74,144,217,0.2); color: var(--blue); }
  .badge-actor { background: rgba(61,220,132,0.2); color: var(--green); }
  .badge-actress { background: rgba(233,30,140,0.2); color: var(--pink); }
  .badge-boxoffice { background: rgba(0,200,83,0.2); color: #00c853; }
  .badge-adapted { background: rgba(255,152,0,0.2); color: #ff9800; }
  .badge-original { background: rgba(156,39,176,0.2); color: #ce93d8; }
  .badge-winner { background: var(--gold); color: #000; }
  .badge-streaming {
    background: rgba(255,255,255,0.08);
    color: var(--text-dim);
    font-size: 0.6rem;
  }
  .badge-streaming.netflix { background: rgba(229,9,20,0.2); color: #e50914; }
  .badge-streaming.prime { background: rgba(0,168,225,0.2); color: #00a8e1; }
  .badge-streaming.hulu { background: rgba(28,231,131,0.2); color: #1ce783; }
  .badge-streaming.max { background: rgba(0,36,255,0.2); color: #6e7fff; }
  .badge-streaming.disney { background: rgba(17,60,207,0.2); color: #4a9cf5; }
  .badge-streaming.paramount { background: rgba(0,100,210,0.2); color: #0064d2; }
  .badge-streaming.peacock { background: rgba(0,0,0,0.2); color: #f6c244; }
  .badge-streaming.apple { background: rgba(160,160,160,0.2); color: #a0a0a0; }
  .badge-streaming.rentbuy { background: rgba(255,165,0,0.15); color: #ffa500; }
  .card-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.25rem; color: #fff; }
  .card-person { font-size: 0.9rem; color: var(--text-dim); margin-bottom: 0.6rem; }
  .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem; }
  .watch-link {
    font-size: 0.75rem;
    color: var(--gold);
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    transition: color 0.2s;
  }
  .watch-link:hover { color: #f5e6a3; }

  /* Table / Spreadsheet view */
  .table-container {
    max-width: 1400px;
    margin: 1rem auto 2rem;
    padding: 0 1.5rem;
    overflow-x: auto;
  }
  .data-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 0.88rem;
    border: 1px solid rgba(212,175,55,0.15);
    border-radius: 8px;
    overflow: hidden;
  }
  .data-table th {
    background: linear-gradient(180deg, #2a2a4a 0%, #222240 100%);
    padding: 0.75rem 1rem;
    text-align: left;
    font-weight: 700;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
    border-bottom: 2px solid var(--gold-dim);
    border-right: 1px solid rgba(255,255,255,0.05);
    white-space: nowrap;
    transition: color 0.2s, background 0.2s;
    position: sticky;
    top: 0;
    z-index: 2;
  }
  .data-table th:last-child { border-right: none; }
  .data-table th:hover { color: var(--gold); background: #2e2e52; }
  .data-table th.sorted { color: var(--gold); background: #2e2e52; }
  .data-table th .sort-arrow { margin-left: 0.4rem; font-size: 0.7rem; opacity: 0.8; }
  .data-table td {
    padding: 0.65rem 1rem;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    border-right: 1px solid rgba(255,255,255,0.03);
    vertical-align: middle;
  }
  .data-table td:last-child { border-right: none; }
  .data-table tbody tr { transition: background 0.15s; }
  .data-table tbody tr:nth-child(even) { background: rgba(255,255,255,0.015); }
  .data-table tbody tr:nth-child(odd) { background: transparent; }
  .data-table tbody tr:hover { background: rgba(212,175,55,0.07) !important; }
  .data-table tr.winner-row { background: rgba(212,175,55,0.08) !important; }
  .data-table tr.winner-row:hover { background: rgba(212,175,55,0.13) !important; }
  .data-table .cell-film { font-weight: 600; color: #fff; max-width: 320px; }
  .data-table .cell-winner { color: var(--gold); font-weight: 700; }
  .data-table .cell-year { font-weight: 700; color: var(--gold-dim); font-variant-numeric: tabular-nums; }
  .data-table .cell-person { max-width: 220px; }
  .table-row-count {
    text-align: right;
    padding: 0.5rem 1rem 0;
    font-size: 0.78rem;
    color: var(--text-dim);
  }

  /* Responsive */
  @media (max-width: 768px) {
    .header h1 { font-size: 1.4rem; }
    .header p { font-size: 0.8rem; }
    .filters { flex-direction: column; align-items: stretch; padding: 1rem; gap: 0.75rem; margin: 0 0.5rem; }
    .filter-group { width: 100%; }
    .filter-group select { width: 100%; }
    .filter-group input[type="text"] { width: 100%; }
    .checkboxes { flex-wrap: wrap; }
    .checkboxes label { font-size: 0.8rem; }
    .stats-bar { flex-direction: column; gap: 0.5rem; padding: 0.5rem 1rem; }
    .stats { flex-direction: column; gap: 0.3rem; }
    .table-container { padding: 0 0.5rem; margin: 0.5rem 0.5rem 2rem; }
    .data-table { font-size: 0.75rem; }
    .data-table th { padding: 0.5rem 0.4rem; font-size: 0.65rem; }
    .data-table td { padding: 0.4rem 0.4rem; }
    .badge { font-size: 0.6rem; padding: 0.15rem 0.4rem; }
    .random-pick { margin: 1rem 0.5rem; padding: 1.5rem 1rem; }
    .random-title { font-size: 1.3rem; }
    .random-btn { font-size: 0.8rem; padding: 0.5rem 1rem; }
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--text-dim);
  }
  .empty-state h3 { font-size: 1.2rem; margin-bottom: 0.5rem; color: var(--text); }

  /* Scroll to top */
  /* Random pick */
  .random-btn {
    background: linear-gradient(135deg, var(--gold-dim), #e8c84a);
    color: #000;
    border: none;
    padding: 0.5rem 1.2rem;
    border-radius: 20px;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    white-space: nowrap;
  }
  .random-btn:hover { transform: scale(1.03); box-shadow: 0 4px 15px rgba(212,175,55,0.3); }
  .random-pick {
    max-width: 500px;
    margin: 1.5rem auto;
    padding: 2rem 2.5rem;
    background: linear-gradient(135deg, #1e1e3a, #2a2a4a);
    border: 2px solid var(--gold);
    border-radius: 16px;
    text-align: center;
    position: relative;
    box-shadow: 0 8px 40px rgba(212,175,55,0.15);
    animation: popIn 0.3s ease-out;
  }
  @keyframes popIn { from { opacity:0; transform: scale(0.9); } to { opacity:1; transform: scale(1); } }
  .random-close {
    position: absolute; top: 0.8rem; right: 1rem;
    background: none; border: none; color: var(--text-dim);
    font-size: 1.5rem; cursor: pointer; line-height: 1;
  }
  .random-close:hover { color: var(--text); }
  .random-label { color: var(--text-dim); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; }
  .random-title {
    font-size: 1.8rem; font-weight: 700; color: #fff;
    margin-bottom: 0.3rem;
    background: linear-gradient(135deg, #fff, var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .random-meta { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 0.8rem; }
  .random-stream { margin-bottom: 1rem; }
  .random-link {
    display: inline-block; color: var(--gold); font-size: 0.9rem;
    margin-bottom: 1rem; text-decoration: none;
  }
  .random-link:hover { text-decoration: underline; }
  .random-again { display: inline-block; font-size: 0.8rem; padding: 0.4rem 1rem; }

  .scroll-top {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--gold-dim);
    color: #000;
    border: none;
    cursor: pointer;
    font-size: 1.2rem;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    transition: transform 0.2s;
    z-index: 100;
  }
  .scroll-top:hover { transform: scale(1.1); }
  .scroll-top.visible { display: flex; }
</style>
</head>
<body>

<div class="header">
  <h1>Academy Awards Explorer</h1>
  <p>Nominations 1970 &ndash; 2024</p>
  <button class="random-btn" id="randomBtn" style="margin-top:1rem;">What should I watch tonight?</button>
</div>

<div class="filters" id="filters">
  <div class="filter-row" style="display:flex;gap:1rem;align-items:flex-start;flex-wrap:wrap;">
    <div class="filter-group">
      <label>Year</label>
      <select id="yearSelect">
        <option value="all">All Years</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Streaming</label>
      <select id="streamingFilter">
        <option value="All">All</option>
        <option value="Netflix">Netflix</option>
        <option value="Prime Video">Prime Video</option>
        <option value="Hulu">Hulu</option>
        <option value="Max">Max</option>
        <option value="Disney+">Disney+</option>
        <option value="Paramount+">Paramount+</option>
        <option value="Peacock">Peacock</option>
        <option value="Apple TV+">Apple TV+</option>
        <option value="Rent/Buy">Rent/Buy Only</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Category Nominees</label>
      <div class="checkboxes" style="display:grid;grid-template-columns:auto auto auto;gap:0.1rem 1rem;">
        <label><input type="checkbox" value="Best Picture" checked> Picture</label>
        <label><input type="checkbox" value="Best Director" checked> Director</label>
        <label><input type="checkbox" value="Best Actor" checked> Actor</label>
        <label><input type="checkbox" value="Best Actress" checked> Actress</label>
        <label><input type="checkbox" value="Best Adapted Screenplay" checked> Adapted Screenplay</label>
        <label><input type="checkbox" value="Best Original Screenplay" checked> Original Screenplay</label>
      </div>
      <div class="toggle-group" style="margin-top:0.4rem;">
        <label class="switch"><input type="checkbox" id="winnersOnly"><span class="slider"></span></label>
        <label class="toggle-label" for="winnersOnly">Winners only</label>
      </div>
    </div>

    <div class="filter-group" style="align-self:flex-start;">
      <label>Box Office</label>
      <div class="checkboxes">
        <label><input type="checkbox" id="boxOfficeToggle" value="boxoffice"> Top 10</label>
      </div>
    </div>

    <div class="filter-group" style="margin-left:auto;">
      <label>Search</label>
      <input type="text" id="searchBox" placeholder="Film or person...">
    </div>
  </div>
</div>

<div class="stats-bar">
  <div class="stats">
    <span class="stat">Showing <strong id="filmCount">0</strong> films</span>
    <span class="stat">Across <strong id="totalCount">0</strong> nominations</span>
  </div>

</div>

<div class="random-pick" id="randomPick" style="display:none;">
  <button class="random-close" id="randomClose">&times;</button>
  <div class="random-label">Tonight you should watch...</div>
  <div class="random-title" id="randomTitle"></div>
  <div class="random-meta" id="randomMeta"></div>
  <div class="random-stream" id="randomStream"></div>
  <a class="random-link" id="randomLink" target="_blank" rel="noopener">Find it on JustWatch &rarr;</a>
  <button class="random-btn random-again" id="randomAgain">Pick another</button>
</div>

<div class="table-container" id="tableContainer">
  <table class="data-table">
    <thead>
      <tr>
        <th data-sort="year">Year <span class="sort-arrow"></span></th>
        <th data-sort="film">Film <span class="sort-arrow"></span></th>
        <th data-sort="categories">Category Nominees <span class="sort-arrow"></span></th>
        <th data-sort="people">Nominees <span class="sort-arrow"></span></th>
        <th data-sort="winner">Won <span class="sort-arrow"></span></th>
        <th data-sort="streaming">Streaming <span class="sort-arrow"></span></th>
        <th>Watch</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<button class="scroll-top" id="scrollTop" title="Scroll to top">&#9650;</button>

  if (hasCats) {
    FILM_LIST.forEach(f => {
      const relevantNoms = searchOverride ? f.noms : f.noms.filter(n => cats.includes(n.category));
      if (relevantNoms.length === 0) return;
      if (selectedYear && f.year !== selectedYear) return;
      if (winOnly && !relevantNoms.some(n => n.winner)) return;
      if (q) {
        const allPeople = f.noms.map(n => n.person.toLowerCase()).join(' ');
        if (!f.film.toLowerCase().includes(q) && !allPeople.includes(q)) return;
      }
      if (stream !== 'All' && f.streaming !== stream) return;

      const boKey = f.film + '|' + f.year;
      const boRank = boLookup[boKey] || 0;

      // If box office is on, only show films that are ALSO in box office top 10
      if (showBoxOffice && boRank === 0) return;

      const cats2 = searchOverride ? f.noms.map(n => n.category) : cats;
      const vn = f.noms.filter(n => cats2.includes(n.category));
      filtered.push({ ...f, visibleNoms: vn, boxOfficeRank: boRank });
    });
  }

  // CASE 2: Box office only (no categories checked)
  if (showBoxOffice && !hasCats) {
    const yearsToShow = selectedYear ? [selectedYear] : Object.keys(BOX_OFFICE).map(Number);
    const seen = new Set();

    for (const yr of yearsToShow) {
      (BOX_OFFICE[yr] || []).forEach((film, idx) => {
        const key = film + '|' + yr;
        if (seen.has(key)) return;
        seen.add(key);

        const streaming = getStreaming(film);
        if (stream !== 'All' && streaming !== stream) return;
        if (q && !film.toLowerCase().includes(q)) return;

        // Check if this film has Oscar noms (for display, not filtering)
        const oscarEntry = FILMS[key];
        const noms = oscarEntry ? oscarEntry.noms : [];
        const visibleNoms = noms; // Show all noms since no category filter

        filtered.push({
          year: yr, film: film, streaming: streaming || getStreaming(film),
          noms: noms, visibleNoms: visibleNoms,
          boxOfficeRank: idx + 1
        });
      });
    }
  }

  // CASE 3: Nothing checked and no search - show nothing
  // (search override already handles the "searching with nothing checked" case)

  // Sort
  filtered.sort((a, b) => {
    let va, vb;
    switch (sortCol) {
      case 'year': va = a.year; vb = b.year; break;
      case 'film': va = a.film.toLowerCase(); vb = b.film.toLowerCase(); break;
      case 'categories': va = a.visibleNoms.length; vb = b.visibleNoms.length; break;
      case 'people': va = a.visibleNoms.map(n=>n.person).join(',').toLowerCase(); vb = b.visibleNoms.map(n=>n.person).join(',').toLowerCase(); break;
      case 'winner': va = a.visibleNoms.some(n=>n.winner) ? 1 : 0; vb = b.visibleNoms.some(n=>n.winner) ? 1 : 0; break;
      case 'streaming': va = a.streaming || 'zzz'; vb = b.streaming || 'zzz'; break;
      default: va = a.year; vb = b.year;
    }
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });

  render();
}

function catClass(cat) {
  if (cat === 'Best Picture') return 'badge-picture';
  if (cat === 'Best Director') return 'badge-director';
  if (cat === 'Best Actor') return 'badge-actor';
  if (cat === 'Best Actress') return 'badge-actress';
  if (cat === 'Best Adapted Screenplay') return 'badge-adapted';
  if (cat === 'Best Original Screenplay') return 'badge-original';
  if (cat === 'Box Office') return 'badge-boxoffice';
  return '';
}

function catShort(cat) {
  return cat.replace('Best ', '');
}

function jwLink(film) {
  return 'https://www.justwatch.com/us/search?q=' + encodeURIComponent(film);
}

function render() {
  const totalNoms = filtered.reduce((sum, f) => sum + f.visibleNoms.length, 0);
  $filmCount.textContent = filtered.length;
  $totalCount.textContent = totalNoms;
  $tableContainer.style.display = 'block';
  renderTable();
}

function renderTable() {
  if (filtered.length === 0) {
    $tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--text-dim);">No results found</td></tr>';
    return;
  }
  const frag = document.createDocumentFragment();
  filtered.forEach(f => {
    const tr = document.createElement('tr');
    const hasWin = f.visibleNoms.some(n => n.winner);
    if (hasWin) tr.className = 'winner-row';
    const sc = streamingClass(f.streaming);

    let catBadges = f.visibleNoms.map(n =>
      `<span class="badge ${catClass(n.category)}">${catShort(n.category)}${n.winner ? ' &#9733;' : ''}</span>`
    ).join(' ');
    if (f.boxOfficeRank > 0) {
      catBadges += ` <span class="badge badge-boxoffice">#${f.boxOfficeRank} Box Office</span>`;
    }

    const people = f.visibleNoms
      .filter(n => n.person)
      .map(n => `${n.person}` + (f.visibleNoms.length > 1 ? ` <small style="opacity:0.5">(${catShort(n.category)})</small>` : ''))
      .join(', ');

    const wonCats = f.visibleNoms.filter(n => n.winner).map(n => catShort(n.category));
    const wonText = wonCats.length > 0 ? `<span class="cell-winner">&#9733; ${wonCats.join(', ')}</span>` : '';

    tr.innerHTML = `
      <td class="cell-year">${f.year}</td>
      <td class="cell-film">${f.film}</td>
      <td>${catBadges}</td>
      <td class="cell-person">${people || '&mdash;'}</td>
      <td>${wonText}</td>
      <td>${f.streaming ? `<span class="badge badge-streaming ${sc}">${f.streaming}</span>` : ''}</td>
      <td><a href="${jwLink(f.film)}" target="_blank" rel="noopener" class="watch-link">JustWatch &#8599;</a></td>
    `;
    frag.appendChild(tr);
  });
  $tableBody.innerHTML = '';
  $tableBody.appendChild(frag);
  // Row count below table
  let rc = document.getElementById('tableRowCount');
  if (!rc) { rc = document.createElement('div'); rc.id = 'tableRowCount'; rc.className = 'table-row-count'; $tableContainer.appendChild(rc); }
  rc.textContent = `Showing ${filtered.length} films`;

  // Update sort arrows
  document.querySelectorAll('.data-table th[data-sort]').forEach(th => {
    const arrow = th.querySelector('.sort-arrow');
    th.classList.toggle('sorted', th.dataset.sort === sortCol);
    if (th.dataset.sort === sortCol) {
      arrow.textContent = sortAsc ? '\u25B2' : '\u25BC';
    } else {
      arrow.textContent = '';
    }
  });
}

// Event listeners
$searchBox.addEventListener('input', applyFilters);
$yearSelect.addEventListener('change', applyFilters);
$winnersOnly.addEventListener('change', applyFilters);
$boxOfficeToggle.addEventListener('change', applyFilters);
$streamingFilter.addEventListener('change', applyFilters);
document.querySelectorAll('.checkboxes input[type="checkbox"]').forEach(cb => cb.addEventListener('change', applyFilters));

document.querySelectorAll('.data-table th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.sort;
    if (sortCol === col) {
      sortAsc = !sortAsc;
    } else {
      sortCol = col;
      sortAsc = true;
    }
    applyFilters();
  });
});

window.addEventListener('scroll', () => {
  $scrollTop.classList.toggle('visible', window.scrollY > 400);
});
$scrollTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

// Random pick
const $randomBtn = document.getElementById('randomBtn');
const $randomPick = document.getElementById('randomPick');
const $randomClose = document.getElementById('randomClose');
const $randomAgain = document.getElementById('randomAgain');
const $randomTitle = document.getElementById('randomTitle');
const $randomMeta = document.getElementById('randomMeta');
const $randomStream = document.getElementById('randomStream');
const $randomLink = document.getElementById('randomLink');

function pickRandom() {
  if (filtered.length === 0) return;
  // Prioritize films available on a streaming service (not Rent/Buy)
  const streamable = filtered.filter(f => f.streaming && f.streaming !== 'Rent/Buy');
  const pool = streamable.length > 0 ? streamable : filtered;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  $randomTitle.textContent = pick.film;

  // Build meta line: year + nominations
  const parts = [pick.year];
  if (pick.visibleNoms && pick.visibleNoms.length > 0) {
    const wins = pick.visibleNoms.filter(n => n.winner).map(n => catShort(n.category));
    const noms = pick.visibleNoms.filter(n => !n.winner).map(n => catShort(n.category));
    if (wins.length > 0) parts.push('Won: ' + wins.join(', '));
    if (noms.length > 0) parts.push('Nominated: ' + noms.join(', '));
  }
  if (pick.boxOfficeRank > 0) parts.push('#' + pick.boxOfficeRank + ' Box Office');
  $randomMeta.textContent = parts.join('  •  ');

  // Streaming badge
  if (pick.streaming && pick.streaming !== 'Rent/Buy') {
    $randomStream.innerHTML = '<span class="badge badge-streaming ' + streamingClass(pick.streaming) + '" style="font-size:1rem;padding:0.4rem 1rem;">' + pick.streaming + '</span>';
  } else {
    $randomStream.innerHTML = '<span style="color:var(--text-dim);font-size:0.85rem;">Available for Rent/Buy</span>';
  }

  $randomLink.href = jwLink(pick.film);
  $randomPick.style.display = 'block';
  $randomPick.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

$randomBtn.addEventListener('click', pickRandom);
$randomAgain.addEventListener('click', () => {
  $randomPick.style.animation = 'none';
  void $randomPick.offsetWidth; // trigger reflow
  $randomPick.style.animation = 'popIn 0.3s ease-out';
  pickRandom();
});
$randomClose.addEventListener('click', () => { $randomPick.style.display = 'none'; });

// Init
applyFilters();
</script>
</body>
</html>
